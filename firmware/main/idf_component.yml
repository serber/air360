dependencies:
  # Exact pin, load-bearing: borrowed master bus handles (AHT30, BMP390, INA226)
  # stay valid only while i2cdev never deletes the bus. Audited for 2.2.2: the
  # bus lives until i2cdev_done() (never called), i2c_dev_delete_mutex() only
  # removes its own device. Bumping this version requires re-auditing bus
  # teardown first — see docs/firmware/adr/implemented-i2c-master-bus-ownership-hardening-adr.md.
  esp-idf-lib/i2cdev: "2.2.2"
  espressif/esp_modem: ^1.1.0
  espressif/ds18b20: 0.4.0
  esp-idf-lib/scd30: 1.0.13
  esp-idf-lib/scd4x: 1.0.9
  esp-idf-lib/si7021: 1.0.9
  esp-idf-lib/sht3x: 1.0.9
  esp-idf-lib/sht4x: 1.0.8
  esp-idf-lib/veml7700: 1.0.9
  esp-idf-lib/dht: 1.3.0
  esp-idf-lib/bmp280: 1.0.9
  esp-idf-lib/bme680: ^1.0.7
  cinderblocks/esp_tinygpsplusplus: 1.1.1
  espressif/led_strip: ^3.0.0
  esp-idf-lib/ina219: 1.0.8
  esp-idf-lib/mhz19b: 1.2.1
  espressif/mdns: '*'
  nordesems/esp-captive-portal: 1.3.0
  espressif/aht30: "1.0.0~1"
  k0i05/esp_bmp390: "1.2.7"
  k0i05/esp_ina226: "1.2.7"
  petrovgp/esp-pms: ^1.0.0
